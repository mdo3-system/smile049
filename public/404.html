<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - ページが見つかりません｜木造ガレージ・倉庫 スマイチ</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
      margin: 20px;
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      color: #b45309;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 16px;
    }
    p {
      font-size: 15px;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #2d6a4f;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1b4332;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>お探しのページが見つかりませんでした</h1>
    <p>
      申し訳ございません。指定されたURLのページは存在しないか、移動・削除された可能性があります。<br>
      URLをご確認いただくか、トップページまたは3Dシミュレーターよりお探しください。
    </p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">スマイチ トップページへ</a>
      <a href="/simulator/" class="btn btn-secondary">3Dガレージシミュレーター</a>
    </div>
  </div>
</body>
</html>
